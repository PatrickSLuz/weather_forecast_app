name: weather_forecast_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.10+21

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  bloc: ^9.2.1
  cupertino_icons: ^1.0.9
  dio: ^5.10.0
  firebase_analytics: ^12.4.3
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_messaging: ^16.4.1
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get_it: ^9.2.1
  google_mobile_ads: ^9.0.0
  intl: ^0.20.2
  package_info_plus: ^10.2.0
  shared_preferences: ^2.5.5
  share_plus: ^13.2.0
  sqflite: ^2.4.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path_android: "assets/app_icon/icon.png"
  adaptive_icon_foreground: "assets/app_icon/icon.png"
  adaptive_icon_background: "assets/app_icon/background.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - environment/
    - assets/
    - assets/app_icon/
    - assets/fonts/
    - assets/icons/
    - assets/logos/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-ExtraLightItalic.ttf
          style: italic
        - asset: assets/fonts/Nunito-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Nunito-LightItalic.ttf
          style: italic
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-MediumItalic.ttf
          style: italic
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBoldItalic.ttf
          style: italic
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-BoldItalic.ttf
          style: italic
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBoldItalic.ttf
          style: italic
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-BlackItalic.ttf
          style: italic
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
          
flutter_intl:
  enabled: true
